name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        id: find
        run: |
          f=$(find . -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "ไม่พบ build.gradle ใน repo นี้ ให้อัปโหลดไฟล์โปรเจกต์ให้ครบ"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: galaxyimpact-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
