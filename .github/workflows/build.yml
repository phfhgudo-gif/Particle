name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: galaxyimpact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
          build-root-directory: galaxyimpact
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: galaxyimpact-jar
          path: galaxyimpact/build/libs/*.jar
