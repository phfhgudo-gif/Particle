name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and find project
        id: find
        run: |
          mkdir -p /tmp/proj
          unzip -q -o ./*.zip -d /tmp/proj
          f=$(find /tmp/proj -name build.gradle | head -1)
          if [ -z "$f" ]; then
            echo "ไม่พบ build.gradle"
            find /tmp/proj -type f | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: onepiece-fx-forge-1.20.1-github-repo-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
